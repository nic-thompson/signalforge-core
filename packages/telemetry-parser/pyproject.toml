[project]
name = "telemetry-parser"
version = "0.1.0"
description = "Structured telemetry extraction engine for schema-versioned analytics and ML pipelines"
requires-python = ">=3.11"
authors = [
    { name = "Nicolas" }
]
dependencies = [
    "event-schema-contracts @ git+https://github.com/nic-thompson/event-schema-contracts@v0.8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
