[project]
name = "telemetry-parser"
version = "0.1.0"
description = "Structured telemetry extraction engine for schema-versioned analytics and ML pipelines"
requires-python = ">=3.11"
authors = [
    { name = "Nicolas" }
]
dependencies = [
    "event-schema-contracts @ git+https://github.com/nic-thompson/event-schema-contracts@v0.8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# PEP 561. Without py.typed shipped in the wheel, a consumer running mypy
# is told this package has no type information and every import from it
# fails as import-untyped — despite the package being mypy --strict clean
# itself. event-schema-contracts hit the identical gap; this repository
# found it the moment something depended on it in turn.
[tool.setuptools.package-data]
telemetry_parser = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
