[project]
name = "event-schema-contracts"
version = "0.8.1"
description = "Canonical telemetry event schema contracts for ingestion pipelines"
requires-python = ">=3.11"

dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.9",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# PEP 561. Without py.typed shipped in the wheel, a consumer running mypy
# against this library is told it has no type information and every import
# from it fails as import-not-found — even though the library is itself
# mypy --strict clean. The marker is what makes the types usable by anyone
# other than this repository.
[tool.setuptools.package-data]
event_schema_contracts = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "PTH"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
