# Add this job to the CI workflow of each component repo:
#   telemetry-parser
#   structured-logging-python
#   greengrass-publisher
#
# It fires a repository_dispatch at signalforge-integration-tests once
# that repo's own tests pass, so the seams are re-verified against the
# exact commit that just went green.
#
# Adjust `needs:` to name that repo's actual test job.

  trigger-integration-tests:
    name: Trigger integration tests
    needs: [test]          # <-- change to this repo's test job name
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch to signalforge-integration-tests
        env:
          # A fine-grained PAT with "Contents: read" on the component
          # repos and "Contents: write" on the integration repo.
          # The default GITHUB_TOKEN CANNOT trigger workflows in another
          # repository — this is a deliberate GitHub restriction, not a
          # configuration mistake. See docs/wiring-component-repos.md.
          DISPATCH_TOKEN: ${{ secrets.INTEGRATION_DISPATCH_TOKEN }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "::warning::INTEGRATION_DISPATCH_TOKEN not set — skipping dispatch."
            echo "The nightly scheduled run will still catch drift, but up to 24h later."
            exit 0
          fi

          http_code=$(curl -sS -o /tmp/dispatch-response.json -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/nic-thompson/signalforge-integration-tests/dispatches \
            -d "{
              \"event_type\": \"component-updated\",
              \"client_payload\": {
                \"repository\": \"${{ github.repository }}\",
                \"sha\": \"${{ github.sha }}\",
                \"ref\": \"${{ github.ref_name }}\"
              }
            }")

          if [ "$http_code" != "204" ]; then
            echo "::error::Dispatch failed with HTTP $http_code"
            cat /tmp/dispatch-response.json
            exit 1
          fi

          echo "Dispatched component-updated for ${{ github.repository }}@${{ github.sha }}"
