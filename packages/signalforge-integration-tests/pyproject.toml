[project]
name = "signalforge-integration-tests"
version = "0.1.0"
description = "Cross-repo integration tests for the SignalForge platform"
requires-python = ">=3.11"

dependencies = []
# Component repos are resolved via PYTHONPATH, not pip — they aren't
# published to PyPI. See .github/workflows/integration.yml for how CI
# checks them out as siblings.

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
