[project]
name = "signal-forge"
version = "1.0.0"
description = "Analytics, detection, replay and dataset control plane for the SignalForge telemetry intelligence platform"
requires-python = ">=3.11"
authors = [
    { name = "SignalForge Engineering" },
]
readme = "README.md"

# Runtime dependencies are intentionally minimal at this phase.
# Each later phase will add its own optional-dependency group rather than
# bloating the analytics core.
dependencies = [
    "pydantic>=2.7,<3",
    "event-schema-contracts @ git+https://github.com/nic-thompson/event-schema-contracts@v0.8.2",
    "structured-logging-python @ git+https://github.com/nic-thompson/structured-logging-python@main",
    "telemetry-parser @ git+https://github.com/nic-thompson/telemetry-parser@main",
]

[project.optional-dependencies]
# Phase 4+ (datasets, S3 partitioning, parquet)
datasets = [
    "pyarrow>=15",
    "pandas>=2.2",
    "boto3>=1.34",
]

# Phase 5+ (alert routing to AWS). Currently empty; deps land when Phase 5
# work begins. boto3 lives in `datasets` since the dataset writer needs it first.
aws = [
]

# Phase 6+ (dashboard projections, DynamoDB-backed store)
dashboards = [
    "boto3>=1.34",
]

# Development tooling
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "mypy>=1.10",
    "ruff>=0.5",
    "hypothesis>=6.100",
    "moto>=5, <6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["signal_forge*"]

# PEP 561. Without this, mypy tells a consumer this package has no type
# information and every import from it fails as import-untyped —
# exactly what happened the first time anything outside this
# repository's own test suite depended on it. event-schema-contracts,
# telemetry-parser and structured-logging-python hit the identical gap
# earlier in this project; this is the fourth repository to need it,
# for the same reason each time: nobody had ever installed the package
# from outside itself.
#
# Note what this does not claim. `mypy --strict signal_forge` currently
# reports 9 errors across 6 files — none in the modules the first
# external consumer (aws-event-pipeline-infra's ingestion consumer)
# imports, but real, and not yet fixed. The marker makes the
# annotations that exist usable to a consumer; it is not an assertion
# that every annotation in this package has been strict-checked.
[tool.setuptools.package-data]
signal_forge = ["py.typed"]

# ----------------------------------------------------------------------
# pytest
# ----------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "determinism: marks tests asserting byte-identical outputs across runs",
    "late_events: marks tests covering late-arriving event behaviour",
]

# ----------------------------------------------------------------------
# ruff
# ----------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "BLE", "C4", "PTH", "SIM", "RUF"]
ignore = ["B008"]

# ----------------------------------------------------------------------
# mypy
# ----------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# pyarrow ships a partial py.typed stub set; several parquet entry points
# (e.g. write_table) are seen as untyped, which trips strict mode's
# disallow_untyped_calls at our call sites. Treat pyarrow as untyped.
# First needed in Phase 4 commit 6, the first source module to import it.
module = "pyarrow.*"
follow_imports = "skip"
