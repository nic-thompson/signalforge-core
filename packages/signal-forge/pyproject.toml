[project]
name = "signal-forge"
version = "0.1.0"
description = "Analytics, detection, replay and dataset control plane for the SignalForge telemetry intelligence platform"
requires-python = ">=3.11"
authors = [
    { name = "SignalForge Engineering" },
]
readme = "README.md"

# Runtime dependencies are intentionally minimal at this phase.
# Each later phase will add its own optional-dependency group rather than
# bloating the analytics core.
dependencies = [
    "pydantic>=2.7,<3",
    "event-schema-contracts @ git+https://github.com/nic-thompson/event-schema-contracts@456269bfa0b69ca5b6ea1f1752c525ba0c505a06",
    "structured-logging-python @ git+https://github.com/nic-thompson/structured-logging-python@00f97c737f40b03f9a73d964d642c532cf6af16e",
    "telemetry-parser @ git+https://github.com/nic-thompson/telemetry-parser@ce84ed069695c858b0813aaeb05ce8b2f4c11ef1",
]

[project.optional-dependencies]
# Phase 4+ (datasets, S3 partitioning, parquet)
datasets = [
    "pyarrow>=15",
    "pandas>=2.2",
    "boto3>=1.34",
]

# Phase 5+ (alert routing to AWS). Currently empty; deps land when Phase 5
# work begins. boto3 lives in `datasets` since the dataset writer needs it first.
aws = [
]

# Development tooling
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "mypy>=1.10",
    "ruff>=0.5",
    "hypothesis>=6.100",
    "moto>=5, <6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["signal_forge*"]

# ----------------------------------------------------------------------
# pytest
# ----------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "determinism: marks tests asserting byte-identical outputs across runs",
    "late_events: marks tests covering late-arriving event behaviour",
]

# ----------------------------------------------------------------------
# ruff
# ----------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "BLE", "C4", "PTH", "SIM", "RUF"]
ignore = ["B008"]

# ----------------------------------------------------------------------
# mypy
# ----------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# pyarrow ships a partial py.typed stub set; several parquet entry points
# (e.g. write_table) are seen as untyped, which trips strict mode's
# disallow_untyped_calls at our call sites. Treat pyarrow as untyped.
# First needed in Phase 4 commit 6, the first source module to import it.
module = "pyarrow.*"
follow_imports = "skip"
