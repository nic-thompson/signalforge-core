[project]
name = "signal-forge"
version = "0.1.0"
description = "Analytics, detection, replay and dataset control plane for the SignalForge telemetry intelligence platform"
requires-python = ">=3.11"
authors = [
    { name = "SignalForge Engineering" },
]
readme = "README.md"

# Runtime dependencies are intentionally minimal at this phase.
# Each later phase will add its own optional-dependency group rather than
# bloating the analytics core.
dependencies = [
    "pydantic>=2.7,<3",
    "event-schema-contracts>=0.1.0",
    "structured-logging-python>=0.1.0",
    "telemetry-parser>=0.1.0",
]

[project.optional-dependencies]
# Phase 4+ (datasets, S3 partitioning, parquet)
datasets = [
    "pyarrow>=15",
    "pandas>=2.2",
]

# Phase 5+ (alert routing to AWS)
aws = [
    "boto3>=1.34",
]

# Development tooling
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "mypy>=1.10",
    "ruff>=0.5",
    "hypothesis>=6.100",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["signal_forge*"]

# ----------------------------------------------------------------------
# pytest
# ----------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "determinism: marks tests asserting byte-identical outputs across runs",
    "late_events: marks tests covering late-arriving event behaviour",
]

# ----------------------------------------------------------------------
# ruff
# ----------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "PTH", "SIM", "RUF"]
ignore = ["B008"]

# ----------------------------------------------------------------------
# mypy
# ----------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false