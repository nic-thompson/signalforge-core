# CI workflow for signal-forge
#
# Three jobs:
#   - lint     : ruff check
#   - typecheck: mypy --strict on signal_forge
#   - test     : matrix over Python 3.11 and 3.12, runs the full test suite
#                with the upstream packages installed from pinned commits,
#                and runs a test-count regression guard so silent test
#                loss cannot reach main.
#
# The test job is the only one that installs the upstream packages, because
# they are only needed at runtime. lint and typecheck operate on the local
# source and do not need the upstreams installed (mypy uses ignore_missing_imports
# from pyproject.toml so unresolvable imports do not fail typecheck — this
# matches the developer experience of opening the repo without the upstreams
# being present).

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs when a new commit lands on the same PR or branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ruff>=0.5"

      - name: Ruff check
        run: ruff check .

  typecheck:
    name: mypy --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install mypy and pydantic
        # pydantic is needed because mypy resolves the pydantic plugin path
        # at startup; ignore_missing_imports handles everything else.
        run: |
          python -m pip install --upgrade pip
          python -m pip install "mypy>=1.10" "pydantic>=2.7,<3"

      - name: mypy
        run: mypy signal_forge

  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install signal-forge with pinned upstream dependencies
        # The pyproject.toml uses PEP 508 direct references with pinned
        # SHAs for event-schema-contracts, structured-logging-python, and
        # telemetry-parser. pip resolves these directly from GitHub.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify upstream contracts import cleanly
        # Sanity check: confirm the production import paths the streaming
        # layer falls back to (event_schema_contracts.versioning.compatibility,
        # structured_logging.core.logger) actually resolve. This is the
        # path that does NOT run in the local-only test loop, so CI is
        # the only place it is exercised.
        run: |
          python -c "from event_schema_contracts.versioning.compatibility import ensure_compatibility, parse_version; print('event_schema_contracts OK')"
          python -c "from structured_logging.core.logger import StructuredLogger; print('structured_logging OK')"
          python -c "import telemetry_parser; print('telemetry_parser OK')"

      - name: Run tests
        # Using stdlib unittest because the test suite was authored against
        # it and does not require pytest fixtures. pytest is available
        # via the [dev] extras for future tests.
        run: |
          python -m unittest discover -s tests -v 2>&1 | tee test-output.txt
          # Extract the test count from the final "Ran NN tests" line.
          test_count=$(grep -oE "Ran [0-9]+ tests" test-output.txt | tail -1 | grep -oE "[0-9]+")
          if [ -z "$test_count" ]; then
            echo "FAIL: could not extract test count from output" >&2
            exit 1
          fi
          echo "TEST_COUNT=$test_count" >> "$GITHUB_ENV"

      - name: Test-count regression guard
        run: python .github/workflows/scripts/check_test_count.py "$TEST_COUNT"

      - name: Job summary
        if: always()
        run: |
          {
            echo "### Test results — Python ${{ matrix.python-version }}"
            echo ""
            echo "Tests collected: \`${TEST_COUNT:-unknown}\`"
            echo ""
            echo "Baseline (from \`.test_count.json\`): \`$(python -c 'import json; print(json.load(open(".github/workflows/scripts/.test_count.json"))["tests"])')\`"
          } >> "$GITHUB_STEP_SUMMARY"